<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="10%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="90%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- background + subtle grid -->
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#fadeEdge)"/>

  <!-- terminal window -->
  <rect x="60" y="40" width="1080" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- window chrome -->
  <circle cx="90" cy="66" r="6" fill="#ff5f56"/>
  <circle cx="114" cy="66" r="6" fill="#ffbd2e"/>
  <circle cx="138" cy="66" r="6" fill="#27c93f"/>
  <text x="600" y="70" font-size="11" fill="#7d8590" text-anchor="middle" letter-spacing="1">akshay-s-31 — profile.sh — 120x40</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#30363d" stroke-width="1"/>

  <!-- prompt line 1 -->
  <text x="92" y="132" font-size="13" fill="#ec4899">➜</text>
  <text x="112" y="132" font-size="13" fill="#7ee787">~/portfolio</text>
  <text x="212" y="132" font-size="13" fill="#7d8590">git:(</text>
  <text x="252" y="132" font-size="13" fill="#79c0ff">main</text>
  <text x="286" y="132" font-size="13" fill="#7d8590">)</text>
  <text x="298" y="132" font-size="13" fill="#e6edf3">whoami --verbose</text>

  <!-- name -->
  <text x="92" y="212" font-size="68" font-weight="800" fill="url(#nameGrad)" letter-spacing="8">AKSHAY S</text>

  <!-- tagline -->
  <text x="96" y="244" font-size="13" fill="#7d8590">
    <tspan fill="#ec4899">//</tspan>
    <tspan> deep learning research  </tspan>
    <tspan fill="#30363d">·</tspan>
    <tspan>  backend engineering  </tspan>
    <tspan fill="#30363d">·</tspan>
    <tspan>  TKM CoE '27</tspan>
  </text>

  <!-- prompt line 2 with cursor -->
  <text x="92" y="282" font-size="13" fill="#ec4899">➜</text>
  <text x="112" y="282" font-size="13" fill="#7ee787">~/portfolio</text>
  <text x="212" y="282" font-size="13" fill="#7d8590">git:(</text>
  <text x="252" y="282" font-size="13" fill="#79c0ff">main</text>
  <text x="286" y="282" font-size="13" fill="#7d8590">)</text>
  <rect x="304" y="270" width="9" height="15" fill="#ec4899">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
